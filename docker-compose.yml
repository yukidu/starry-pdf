# LOCAL EVALUATION ONLY — do not publish these services directly.
services:
  stirling-pdf:
    image: docker.stirlingpdf.com/stirlingtools/stirling-pdf:3.2.1
    restart: unless-stopped
    mem_limit: 4g
    expose:
      - "8080"
    environment:
      SECURITY_ENABLELOGIN: "true"
      SYSTEM_DEFAULTLOCALE: "zh-TW"
      SYSTEM_GOOGLEVISIBILITY: "false"
    volumes:
      - ./stirling-data/configs:/configs
      - ./stirling-data/logs:/logs
      - ./stirling-data/customFiles:/customFiles
      - ./stirling-data/pipeline:/pipeline
      - ./stirling-data/storage:/storage
      - ./stirling-data/tessdata:/usr/share/tessdata
    networks:
      - pdf-internal
  local-web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - stirling-pdf
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./launchpad:/usr/share/nginx/html:ro
    networks:
      - pdf-internal
networks:
  pdf-internal:
    driver: bridge
