name: Runtime PDF smoke (no deployment)

on:
  pull_request:
    paths:
      - docker-compose.yml
      - docker-compose.ci.yml
      - nginx/**
      - launchpad/**
      - scripts/smoke_pdf.py
      - .github/workflows/runtime-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pdf-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actual-pdf-smoke:
    name: Docker PDF merge / split / compress
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install smoke-test dependencies (temporary CI only)
        run: python -m pip install --disable-pip-version-check requests pypdf

      - name: Validate Docker configuration
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml config --quiet

      - name: Start isolated local PDF evaluation
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d

      - name: Actually process generated PDF test files
        run: python -u scripts/smoke_pdf.py

      - name: Save only diagnostic container logs if failed
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --no-color --tail=120

      - name: Clean up local CI containers and volumes
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down --volumes --remove-orphans
