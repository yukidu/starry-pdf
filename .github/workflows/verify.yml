name: Verify (no deployment)
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python syntax
        run: python -m compileall -q scripts tests api
      - name: Original scaffold unit tests
        run: python -m unittest discover -s tests -p 'test_project.py' -v
      - name: Shell syntax
        run: bash -n scripts/*.sh
      - name: Deployment guard
        run: echo "No production deployment has been configured."
